services:
  flama-media:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flama-media
    restart: unless-stopped
    ports:
      # Set the private VPN bind address in host-specific configuration.
      - "${MEDIA_BIND_HOST:-127.0.0.1}:4792:4792"
    environment:
      - PORT=4792
      - LISTEN_HOST=0.0.0.0
      - MEDIA_SHARED_SECRET=${MEDIA_SHARED_SECRET:?MEDIA_SHARED_SECRET is required}
      - GATEWAY_SECRET=${GATEWAY_SECRET:?GATEWAY_SECRET is required}
      - INTERNAL_SECURITY_SECRET=${INTERNAL_SECURITY_SECRET:?INTERNAL_SECURITY_SECRET is required}
      - MEDIA_STORAGE_ROOT=/data/flama/media
      - MEDIA_STAGE_TTL_SECONDS=86400
      - MAX_UPLOAD_BYTES=20971520
      - IMAGE_RESIZE_DIMENSION=1600
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - STROKE_ROLE=${STROKE_ROLE:-disabled}
      - STROKE_DATASET_ROOT=${STROKE_DATASET_ROOT:-}
      - STROKE_STORAGE_ROOT=/data/flama/strokes
    volumes:
      # Host systemd-tmpfiles must clean data/media/staging after one day.
      - ${MEDIA_HOST_ROOT:-./data/media}:/data/flama/media
      - ${STROKE_HOST_ROOT:-./data/strokes}:/data/flama/strokes
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
